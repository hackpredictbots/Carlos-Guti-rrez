    <circle cx="678" cy="132" r="29" fill="url(#bomb)" stroke="#A9BDD7" stroke-width="2.5"/>
    <path d="M661 121Q667 111 678 110" stroke="#DCEBFF" stroke-width="2.4" opacity=".7"/>
    <ellipse cx="669" cy="143" rx="7" ry="4" fill="#19243A" opacity=".45"/>
