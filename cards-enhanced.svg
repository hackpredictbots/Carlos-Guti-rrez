    <linearGradient id="mines" x1="430" y1="30" x2="790" y2="215" gradientUnits="userSpaceOnUse"><stop stop-color="#17463D"/><stop offset=".55" stop-color="#133B39"/><stop offset="1" stop-color="#14252F"/></linearGradient>
    <linearGradient id="penalty" x1="810" y1="30" x2="1170" y2="215" gradientUnits="userSpaceOnUse"><stop stop-color="#283C70"/><stop offset=".55" stop-color="#252D58"/><stop offset="1" stop-color="#191C36"/></linearGradient>
